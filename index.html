<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dünya Partisi - Turnuva Gecesi</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg1:#030712;--bg2:#0f172a;--ink:#f8fafc;--mute:#94a3b8;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 50% 0%,var(--bg2),var(--bg1) 80%) fixed;overflow-x:hidden}
main{max-width:1150px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:clamp(26px,5vw,42px);margin:6px 0 4px;text-align:center;font-weight:900;letter-spacing:-0.5px;background:linear-gradient(135deg,#60a5fa,#e879f9,#facc15);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 40px rgba(96,165,250,.3)}
.sub{text-align:center;color:var(--mute);margin:0 0 20px;font-size:15px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;max-width:460px;margin:30px auto;backdrop-filter:blur(16px);box-shadow:0 20px 40px rgba(0,0,0,.4)}
.panel h2{margin:0 0 14px;font-size:20px;text-align:center;font-weight:700}
input{width:100%;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--ink);padding:14px;font:inherit;font-size:17px;margin-bottom:12px;text-align:center;transition:border-color .2s}
input:focus{outline:none;border-color:#60a5fa;box-shadow:0 0 15px rgba(96,165,250,.3)}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:14px 26px;cursor:pointer;color:#0f172a;background:linear-gradient(135deg,#38bdf8,#818cf8);box-shadow:0 8px 25px rgba(56,189,248,.3);transition:transform .15s,filter .15s;width:100%}
button:hover{transform:translateY(-2px);filter:brightness(1.1)}
button:disabled{opacity:.35;cursor:not-allowed;transform:none;filter:none}
.hide{display:none!important}
.msg{text-align:center;color:#f87171;margin:10px 0;font-weight:600}

.code{font-size:clamp(36px,8vw,60px);letter-spacing:.2em;font-weight:900;text-align:center;color:#facc15;text-shadow:0 0 25px rgba(250,204,21,.4);margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0;min-height:35px}
.chip{padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);font-size:13px;font-weight:600;animation:drop .3s cubic-bezier(.2,1.4,.4,1) both}
.chip.done{background:var(--c);color:#0f172a;border:none}
@keyframes drop{from{opacity:0;transform:translateY(-20px) scale(.4)}}

.me{text-align:center;font-size:clamp(17px,4vw,22px);font-weight:800;margin:12px 0 20px;padding:14px 20px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line);box-shadow:0 8px 32px rgba(0,0,0,.2)}

/* Dünya Haritası Sahnesi */
.stage{border-radius:28px;overflow:hidden;border:2px solid var(--line);box-shadow:0 25px 60px rgba(0,0,0,.6);background:#020617;position:relative;margin-bottom:24px}
.stage svg{display:block;width:100%;height:auto;max-height:500px}

@keyframes spaceSpin {
  0% { transform: rotate(0deg) scale(1); filter: drop-shadow(0 0 10px rgba(56,189,248,0.2)); }
  50% { transform: rotate(180deg) scale(1.03); filter: drop-shadow(0 0 35px rgba(232,121,249,0.5)); }
  100% { transform: rotate(360deg) scale(1); filter: drop-shadow(0 0 10px rgba(56,189,248,0.2)); }
}
.spinning { animation: spaceSpin 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; transform-origin: 500px 260px; }

.world-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-top:20px}
.continent-card{border-radius:24px;padding:20px;border:2px solid var(--c);background:linear-gradient(145deg, color-mix(in srgb,var(--c) 15%, #0f172a), #090d16);box-shadow:0 12px 40px rgba(0,0,0,.4);position:relative;overflow:hidden}
.continent-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--c)}
.continent-card h3{margin:0 0 10px;font-size:20px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800}
.game-badge{font-size:12px;padding:4px 12px;border-radius:20px;background:rgba(0,0,0,.5);border:1px solid var(--c);color:#fff;font-weight:700;letter-spacing:.5px}

.matches-box{margin-top:16px;background:rgba(0,0,0,.35);border-radius:16px;padding:12px;border:1px solid rgba(255,255,255,.08)}
.match-item{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.05);margin:6px 0;padding:10px 14px;border-radius:12px;font-weight:700;font-size:15px;border:1px solid rgba(255,255,255,.04)}
.match-item span.vs{font-size:11px;color:#facc15;background:rgba(250,204,21,.15);padding:3px 8px;border-radius:6px;font-weight:900}

.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:40;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<main>
  <h1>🌍 Dünya Partisi & Turnuva Gecesi</h1>
  <p class="sub">Avrupa (Dart) • Asya (Langırt) • Amerika (Beerpong)</p>
  <div class="msg hide" id="err"></div>

  <!-- Tek Tip Giriş Paneli -->
  <section id="start" class="panel">
    <h2>Odaya Giriş Yap</h2>
    <input id="jname" maxlength="12" placeholder="Adın veya Rumuzun" autocomplete="off">
    <input id="jcode" maxlength="4" placeholder="Oda Kodu (Yeni kuracaksan boş bırak)" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em">
    <div class="row"><button id="enterBtn">🚀 Odaya Gir / Oda Kur</button></div>
  </section>

  <!-- Lobi Paneli -->
  <section id="lobby" class="panel hide">
    <div id="hostSection" class="hide">
      <p class="sub" style="margin-bottom:0">Oda Kodun (Arkadaşlarınla paylaş):</p>
      <div class="code" id="code"></div>
    </div>
    <h2>Bağlanan Oyuncular</h2>
    <p class="sub" id="plcount">0 oyuncu bağlandı</p>
    <div class="chips" id="plist"></div>
    <div class="row" id="hostControls" style="margin-top:16px">
      <button id="startSim" disabled>🌍 Katılımı Kapat & Dünyayı Döndür</button>
    </div>
    <p class="sub" id="waitMsg" class="hide" style="margin-top:10px">Moderatörün dünyayı döndürmesi bekleniyor...</p>
  </section>

  <!-- Oyun Haritası ve Eşleşmeler Ekranı -->
  <section id="game" class="hide">
    <div class="me" id="me"></div>
    
    <div class="stage">
      <svg viewBox="0 0 1000 520" id="map" role="img" aria-label="Dünya Haritası">
        <defs>
          <radialGradient id="oc" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#020617"/></radialGradient>
          <filter id="glow"><feGaussianBlur stdDeviation="5" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <rect width="1000" height="520" fill="url(#oc)"/>
        <g id="waves"></g>
        <g id="earthGroup">
          <g id="lands"></g>
        </g>
      </svg>
    </div>

    <div class="row hide" id="hostbar">
      <button id="restartSim">🔄 Simülasyonu Yeniden Çalıştır</button>
    </div>

    <div class="world-grid" id="worldGrid"></div>
  </section>
</main>

<script>
const C=[
 {n:"Avrupa", e:"🏰", game:"🎯 DART", c:"#38bdf8", x:505, y:112, d:"M450,90 L520,70 L560,95 L550,135 L500,150 L455,140Z"},
 {n:"Asya", e:"🐉", game:"🏓 LANGIRT", c:"#f87171", x:740, y:130, d:"M565,70 L720,50 L880,80 L900,150 L830,210 L760,230 L700,200 L640,180 L585,150Z"},
 {n:"Amerika", e:"🦅", game:"🍻 BEERPONG", c:"#4ade80", x:210, y:130, d:"M60,70 L200,40 L300,60 L330,110 L290,170 L260,215 L215,225 L190,190 L140,160 L90,130Z"}
];

const $=id=>document.getElementById(id);
const NS="http://www.w3.org/2000/svg";

let isHost=false, S={phase:"lobby",players:[],matches:{0:[],1:[],2:[]},seq:0,simulating:false}, lastSeq=null;
let peer=null, conn=null, hostConnMap=new Map(), myName="", myPeerId="", roomKey="";

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id,on){$(id).classList.toggle("hide",!on)}
function err(t){$("err").textContent=t;show("err",!!t)}

/* Dalgalar */
for(let i=0;i<5;i++){
  const p=document.createElementNS(NS,"path");
  p.setAttribute("d","M0,"+(50+i*90)+" Q250,"+(20+i*90)+" 500,"+(50+i*90)+" T1000,"+(50+i*90));
  p.style.stroke="rgba(255,255,255,.05)";p.style.fill="none";p.style.strokeWidth="1.5";
  $("waves").appendChild(p);
}

/* Kıta Çizimleri */
const lands=C.map((c,i)=>{
  const g=document.createElementNS(NS,"g");
  const p=document.createElementNS(NS,"path");
  p.setAttribute("d",c.d);p.setAttribute("fill",c.c);p.setAttribute("fill-opacity",".85");
  p.style.filter="url(#glow)";
  
  const t=document.createElementNS(NS,"text");
  t.setAttribute("x",c.x);t.setAttribute("y",c.y-10);
  t.setAttribute("text-anchor","middle");t.setAttribute("fill","#fff");
  t.setAttribute("font-weight","900");t.setAttribute("font-size","18px");
  t.setAttribute("paint-order","stroke");t.setAttribute("stroke","#000");t.setAttribute("stroke-width","5px");
  t.textContent=c.e+" "+c.n;

  const subT=document.createElementNS(NS,"text");
  subT.setAttribute("x",c.x);subT.setAttribute("y",c.y+14);
  subT.setAttribute("text-anchor","middle");subT.setAttribute("fill",c.c);
  subT.setAttribute("font-weight","900");subT.setAttribute("font-size","14px");
  subT.setAttribute("paint-order","stroke");subT.setAttribute("stroke","#000");subT.setAttribute("stroke-width","4px");
  subT.textContent=c.game;

  g.append(p,t,subT);
  $("lands").appendChild(g);
  return {g,p};
});

/* Giriş İşlemi (Otomatik Kurucu veya Katılımcı) */
$("enterBtn").onclick=()=>{
  const n = $("jname").value.trim().slice(0,12);
  let c = $("jcode").value.trim().toUpperCase();
  if(!n) return err("Lütfen adını yaz.");

  myName = n;
  
  if(!c){
    // Oda kodu boş bırakıldıysa moderatör ol
    isHost = true;
    const al="ABCDEFGHJKMNPQRSTUVWXYZ23456789";let code="";for(let i=0;i<4;i++)code+=al[Math.floor(Math.random()*al.length)];
    roomKey="dunyapartisi-"+code;
    
    peer = new Peer(roomKey);
    peer.on('open', ()=>{
      show("start",false); show("lobby",true); show("hostSection",true); show("hostControls",true);
      $("code").textContent=code;
      $("waitMsg").classList.add("hide");
      
      // Kendini ekle
      peer.on('connection', (connection)=>{
        conn = connection;
        conn.on('data', (data)=>{
          if(data.type === 'join' && S.phase === 'lobby'){
            let name = data.name, pId = conn.peer;
            hostConnMap.set(pId, conn);
            if(!S.players.some(p => p[2] === pId)){
              S.players.push([name, -1, pId]);
            }
            broadcastState(); lobbyRender();
          }
        });
        conn.on('close', ()=>{
          S.players = S.players.filter(p => p[2] !== conn.peer);
          hostConnMap.delete(conn.peer);
          broadcastState(); lobbyRender();
        });
      });
      
      // Moderatörün kendisini de oyuncu listesine ekleyelim
      setTimeout(()=>{
        myPeerId = peer.id;
        S.players.push([myName, -1, myPeerId]);
        lobbyRender();
      }, 300);
    });
    peer.on('error', ()=>{ err("Oda kurulamadı, tekrar dene."); });

  } else {
    // Oda kodu yazıldıysa oyuncu olarak katıl
    if(c.length !== 4) return err("Oda kodu 4 haneli olmalıdır.");
    isHost = false;
    roomKey="dunyapartisi-"+c;

    peer = new Peer();
    peer.on('open', (id)=>{
      myPeerId = id;
      conn = peer.connect(roomKey);
      
      conn.on('open', ()=>{
        show("start",false); show("lobby",true); show("hostSection",false); show("hostControls",false);
        $("waitMsg").classList.remove("hide");
        err("");
        conn.send({type:'join', name: myName});
      });

      conn.on('data', (st)=>{ applyState(st, true); });
      conn.on('error', ()=>{ err("Odaya ulaşılamadı. Kodu kontrol et."); });
    });
    peer.on('error', ()=>{ err("Bağlantı kurulamadı."); });
  }
};

function broadcastState(){
  if(!isHost) return;
  hostConnMap.forEach((c)=>{ if(c.open) c.send(S); });
}

function lobbyRender(){
  const names = S.players.map(p => p[0]);
  $("plcount").textContent = names.length + " oyuncu bağlandı";
  chips($("plist"), names);
  if(isHost){
    $("startSim").disabled = names.length < 2;
  }
}

function chips(el,names){
  el.innerHTML="";
  names.forEach((n,i)=>{
    const s=document.createElement("span"); s.className="chip"; s.textContent=n;
    s.style.animationDelay=(i*.04)+"s"; el.appendChild(s);
  });
}

/* --- DÜNYA SİMÜLASYONU VE EŞLEŞTİRME --- */
$("startSim").onclick=()=>runSimulation();
$("restartSim").onclick=()=>runSimulation();

function runSimulation(){
  if(S.players.length < 2) return;
  
  // Eşit şekilde 3 kıtaya dağıt
  const shuffled = shuffle(S.players);
  const assignedPlayers = shuffled.map((p, idx) => {
    const continentIdx = idx % 3; // 0: Avrupa, 1: Asya, 2: Amerika
    return [p[0], continentIdx, p[2]];
  });

  let matchesByContinent = {0: [], 1: [], 2: []};
  
  for(let cId = 0; cId < 3; cId++){
    let cPlayers = assignedPlayers.filter(p => p[1] === cId);
    for(let i = 0; i < cPlayers.length - 1; i += 2){
      matchesByContinent[cId].push([cPlayers[i][0], cPlayers[i+1][0]]);
    }
    if(cPlayers.length % 2 !== 0 && cPlayers.length > 0){
      let lastOne = cPlayers[cPlayers.length - 1][0];
      let partner = assignedPlayers.find(p => p[0] !== lastOne);
      if(partner) matchesByContinent[cId].push([lastOne, partner[0]]);
    }
  }

  S = {
    phase: "play",
    players: assignedPlayers,
    matches: matchesByContinent,
    seq: S.seq + 1,
    simulating: true
  };
  lastSeq = S.seq;
  applyState(S, false);
  broadcastState();
}

function applyState(st, fromNet){
  S = st;
  show("start",false); show("lobby",false); show("game",true);
  
  const earth = $("earthGroup");
  if(st.simulating){
    earth.classList.add("spinning");
    setTimeout(()=>{
      earth.classList.remove("spinning");
      if(isHost) { S.simulating = false; broadcastState(); }
      render();
      triggerConfetti();
    }, 3000);
  } else {
    earth.classList.remove("spinning");
    render();
  }
}

function render(){
  show("hostbar", isHost);
  const myId = isHost && myPeerId === "" ? S.players[0]?.[2] : myPeerId;
  const mine = S.players.find(p => p[2] === myId);

  if(isHost){
    $("me").textContent = "🎙️ Moderatör Paneli - Turnuva Kontrol Merkezi";
  } else if(mine){
    const kont = C[mine[1]];
    $("me").textContent = `✨ Kıtan: ${kont.e} ${kont.n} | Yarışacağın Branş: ${kont.game}`;
  } else {
    $("me").textContent = "Turnuva devam ediyor...";
  }

  const grid = $("worldGrid"); grid.innerHTML = "";
  C.forEach((c, ci)=>{
    const card = document.createElement("div");
    card.className = "continent-card";
    card.style.setProperty("--c", c.c);
    
    card.innerHTML = `
      <h3>${c.e} ${c.n} <span class="game-badge">${c.game}</span></h3>
      <div class="chips" id="c-players-${ci}"></div>
      <div class="matches-box" id="c-matches-${ci}">
        <div style="font-size:11px;color:var(--mute);text-align:center;margin-bottom:6px;font-weight:700;letter-spacing:1px">İKİLİ EŞLEŞMELER (VS)</div>
      </div>
    `;
    grid.appendChild(card);

    const pContainer = card.querySelector(`#c-players-${ci}`);
    S.players.filter(p => p[1] === ci).forEach(p=>{
      const chip = document.createElement("span");
      chip.className = "chip done";
      chip.style.setProperty("--c", c.c);
      chip.textContent = p[0];
      pContainer.appendChild(chip);
    });

    const mContainer = card.querySelector(`#c-matches-${ci}`);
    const matches = S.matches[ci] || [];
    if(matches.length === 0){
      const emptyDiv = document.createElement("div");
      emptyDiv.style.cssText = "text-align:center;font-size:13px;color:var(--mute);padding:8px;";
      emptyDiv.textContent = S.simulating ? "🌍 Dünya dönüyor, rakipler seçiliyor..." : "Eşleşme bulunamadı.";
      mContainer.appendChild(emptyDiv);
    } else {
      matches.forEach(m => {
        const mDiv = document.createElement("div");
        mDiv.className = "match-item";
        mDiv.innerHTML = `<span>⚔️ ${m[0]}</span> <span class="vs">VS</span> <span>${m[1]}</span>`;
        mContainer.appendChild(mDiv);
      });
    }
  });
}

function triggerConfetti(){
  const cols=["#38bdf8","#f87171","#4ade80","#facc15","#e879f9","#fff"];
  for(let i=0;i<60;i++){
    const d=document.createElement("div"); d.className="conf";
    d.style.left=Math.random()*100+"vw"; d.style.background=cols[i%6];
    d.style.animationDuration=(1.5+Math.random()*2)+"s";
    d.style.animationDelay=Math.random()*.4+"s";
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),4000);
  }
}
</script>
</body>
</html>
